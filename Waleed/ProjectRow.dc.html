<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:32px 28px;">
  <sc-for list="{{ list }}" as="proj" hint-placeholder-count="6">
    <a href="{{ proj.href }}" target="{{ proj.target }}" rel="noopener noreferrer" style="display:block; background:#111112; border:1px solid #232325; border-radius:22px; overflow:hidden; text-decoration:none; color:#fff; transition:transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;" style-hover="transform:translateY(-6px); border-color:#3a3a3d; background:#151517;">
      <div style="position:relative; aspect-ratio:1/1; overflow:hidden; background:#18181a;">
        <img src="{{ proj.image }}" alt="{{ proj.title }}" loading="lazy" style="width:100%; height:100%; object-fit:cover; display:block; transition:transform 0.5s ease;" style-hover="transform:scale(1.04);">
      </div>
      <div style="padding:22px 22px 24px;">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px;">
          <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:21px; line-height:1.2;">{{ proj.title }}</div>
          <sc-if value="{{ proj.hasLink }}" hint-placeholder-val="{{ true }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF5A1F" stroke-width="2" style="flex-shrink:0; margin-top:4px;"><path d="M7 17L17 7M7 7h10v10"/></svg>
          </sc-if>
        </div>
        <div style="color:#9a9a9a; font-size:14px; line-height:1.65;">{{ proj.description }}</div>

        <sc-if value="{{ showDetail }}">
          <sc-if value="{{ proj.hasContribution }}">
            <div style="margin-top:18px;">
              <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#FF5A1F; margin-bottom:8px;">Contribution</div>
              <div style="display:flex; flex-direction:column; gap:6px;">
                <sc-for list="{{ proj.contribution }}" as="line" hint-placeholder-count="2">
                  <div style="color:#9a9a9a; font-size:13.5px; line-height:1.6;">{{ line }}</div>
                </sc-for>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ proj.hasRepoLinks }}">
            <div style="margin-top:16px; display:flex; flex-direction:column; gap:6px;">
              <sc-for list="{{ proj.repoLinks }}" as="repo" hint-placeholder-count="2">
                <span style="color:#FF5A1F; font-size:13px; word-break:break-all;">{{ repo }}</span>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ proj.noLink }}">
            <div style="margin-top:16px; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#5e5e61;">Link: Not Available</div>
          </sc-if>
        </sc-if>
      </div>
    </a>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1000, &quot;height&quot;: 700}, &quot;list&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;any[]&quot;}, &quot;showDetail&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const list = (this.props.list || []).map(p => {
      const contribution = p.contribution || [];
      const repoLinks = p.repoLinks || [];
      const hasLink = !!p.link;
      return {
        ...p,
        contribution,
        repoLinks,
        hasContribution: contribution.length > 0,
        hasRepoLinks: repoLinks.length > 0,
        hasLink,
        noLink: !hasLink && repoLinks.length === 0,
        href: hasLink ? p.link : (repoLinks[0] || undefined),
        target: hasLink || repoLinks.length ? '_blank' : undefined,
      };
    });
    return { list, showDetail: this.props.showDetail ?? false };
  }
}
</script>
</body>
</html>
